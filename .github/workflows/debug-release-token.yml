name: debug-release-token

# 临时诊断：分清 POST /releases 的 403 是 payload 哪一部分引起的（用完删除）
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: 二分法逐项试
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          API="https://api.github.com/repos/$GITHUB_REPOSITORY/releases"
          OLD_SHA=6d5501f832409c689b1aeb1f5928fe2ff4f27460
          TS=$(date +%s)

          post() {
            local label="$1"; local payload="$2"
            local code
            code=$(curl -s -D /tmp/h.txt -o /tmp/b.txt -w '%{http_code}' -X POST \
              -H "Authorization: token $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$API" --data "$payload")
            echo "### $label → HTTP $code"
            if [ "$code" != "201" ]; then
              grep -i -E "^HTTP/|x-accepted-github-permissions" /tmp/h.txt || true
              echo "--- body ---"; head -c 300 /tmp/b.txt; echo
            fi
          }

          post "A 只有 tag_name" \
            "{\"tag_name\":\"probe-a-$TS\"}"

          post "B + 老 commit 作为 target" \
            "{\"tag_name\":\"probe-b-$TS\",\"target_commitish\":\"$OLD_SHA\"}"

          post "C + 带斜杠的标题" \
            "{\"tag_name\":\"probe-c-$TS\",\"name\":\"GKI android13 / 5.15 - ReSukiSU\"}"

          post "D + 生成式说明正文" \
            "{\"tag_name\":\"probe-d-$TS\",\"name\":\"probe d\",\"body\":\"## GKI 内核构建产物\\n\\n> 本 Release 由工作流自动发布，**滚动更新**\\n\\n| 项目 | 内容 |\\n|:---|:---|\\n| 平台 | \`android13\` / 5.15 |\\n| 来源运行 | [#1](https://github.com/x/y/actions/runs/1) |\\n\"}"

          post "E 完整复刻（标题+老commit+正文）" \
            "$(jq -nc --arg t "probe-e-$TS" --arg n "GKI android13 / 5.15 - ReSukiSU" --arg c "$OLD_SHA" \
               '{tag_name:$t, name:$n, target_commitish:$c, body:"## GKI 内核构建产物\n\n> 滚动更新\n"}')"

          echo "=== 清理本次探针 ==="
          for t in $(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=50" --jq '.[].tag_name | select(startswith("probe-"))'); do
            gh release delete "$t" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes && echo "已删 $t"
          done
