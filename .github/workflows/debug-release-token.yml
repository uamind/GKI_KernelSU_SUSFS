name: debug-release-token

# 临时诊断：确认 GITHUB_TOKEN 为什么建不了 Release
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: 探针
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== gh 版本 ==="
          gh --version | head -1

          echo "=== 仓库可写性（GET repo 的响应头）==="
          curl -s -D - -o /dev/null \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY" \
            | grep -i -E "^HTTP/|x-accepted-github-permissions|x-oauth-scopes|x-ratelimit-remaining" || true

          TAG="probe-ci-$(date +%s)"
          echo "=== POST /releases tag=$TAG ==="
          code=$(curl -s -D /tmp/h.txt -o /tmp/b.txt -w '%{http_code}' -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases" \
            -d "{\"tag_name\":\"$TAG\",\"name\":\"probe\",\"target_commitish\":\"$GITHUB_SHA\"}")
          echo "HTTP_CODE=$code"
          grep -i -E "^HTTP/|x-accepted-github-permissions|^x-ratelimit-remaining" /tmp/h.txt || true
          echo "--- body ---"
          head -c 800 /tmp/b.txt
          echo

          echo "=== gh release create 走一遍 ==="
          gh release create "$TAG-gh" --repo "$GITHUB_REPOSITORY" \
            --title probe --notes probe --target "$GITHUB_SHA" && echo "gh 成功" || echo "gh 失败: $?"
