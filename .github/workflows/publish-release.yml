# ========================================
# 发布 Release（可复用工作流）
# ========================================
# 作用：把一次构建 run 的产物发布到 GitHub Release。
#
# 为什么需要这一步：
#   GitHub Actions 的 artifact 只保留 90 天（免费计划上限，调不大），
#   过期后产物被永久删除、日志也变成 410 Gone，删除后无法恢复。
#   Release 的 Assets 不会过期，所以把产物同时发一份到 Release，
#   下载链接就能长期有效。
#
# 两种用法：
#   1. 自动：build.yml 在每次内核构建结束后调用本工作流（滚动更新）
#   2. 手动：Actions →「发布 Release」→ Run workflow，填一个历史 run_id，
#      即可把该 run 还在保留期内的产物补发到 Release
#
# 发布规则：
#   同一个「平台 + 内核版本 + KernelSU 变体」共用一个滚动 Release，
#   tag 形如 A14-6.1-ReSukiSU；每次构建用 --clobber 覆盖同名文件，
#   所以下载链接固定、体积不膨胀，且永远是最近一次成功构建的产物。

name: 发布 Release

on:
  workflow_call:
    inputs:
      run_id:
        description: "要发布的 workflow run ID"
        required: true
        type: string
      android_version:
        description: "平台，如 android14（留空自动识别）"
        required: false
        type: string
        default: ""
      kernel_version:
        description: "内核版本，如 6.1（留空自动识别）"
        required: false
        type: string
        default: ""
      ksu_variant:
        description: "KernelSU 变体（留空自动识别）"
        required: false
        type: string
        default: ""
      sub_levels:
        description: "只发布这些子版本号（空格/逗号分隔，如 162）；留空=全部"
        required: false
        type: string
        default: ""
      notes_header:
        description: "附加到 Release 说明里的构建配置（Markdown，可选）"
        required: false
        type: string
        default: ""

  workflow_dispatch:
    inputs:
      run_id:
        description: "要发布的 run ID（在 Actions 运行页面地址栏末尾）"
        required: true
        type: string
      android_version:
        description: "平台，如 android14（留空自动识别）"
        required: false
        type: string
        default: ""
      kernel_version:
        description: "内核版本，如 6.1（留空自动识别）"
        required: false
        type: string
        default: ""
      ksu_variant:
        description: "KernelSU 变体（留空自动识别）"
        required: false
        type: string
        default: ""
      sub_levels:
        description: "只发布这些子版本号（空格/逗号分隔，如 162）；留空=全部"
        required: false
        type: string
        default: ""

permissions:
  contents: write
  actions: read

jobs:
  publish:
    name: "发布 Release"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ==================== 下载并整理产物 ====================
      - name: 下载并整理构建产物
        id: collect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ inputs.run_id }}
          IN_ANDROID: ${{ inputs.android_version }}
          IN_KERNEL: ${{ inputs.kernel_version }}
          IN_VARIANT: ${{ inputs.ksu_variant }}
          IN_SUB_LEVELS: ${{ inputs.sub_levels }}
        run: |
          set -euo pipefail

          echo "目标 run: $RUN_ID"

          # ---- 1. 下载该 run 的全部 artifact ----
          rm -rf downloaded
          mkdir -p downloaded
          if ! gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --dir downloaded; then
            echo "::error::下载产物失败：run 不存在，或产物已超过 90 天保留期被 GitHub 永久删除（只能重新构建）"
            exit 1
          fi

          shopt -s nullglob
          dirs=(downloaded/*/)
          if [ "${#dirs[@]}" -eq 0 ]; then
            echo "::error::该 run 没有任何 artifact，无需发布"
            exit 1
          fi
          echo "已下载 ${#dirs[@]} 个 artifact"

          # ---- 2. 识别平台 / 内核版本 / 变体 ----
          ANDROID="$IN_ANDROID"
          KERNEL="$IN_KERNEL"

          if [ -z "$ANDROID" ] || [ -z "$KERNEL" ]; then
            # artifact 名形如 ReSukiSU_kernel-android14-6.1-84-AnyKernel3
            detected=$(printf '%s\n' "${dirs[@]}" \
              | sed -n 's#.*_kernel-\(android[0-9]\{1,2\}\)-\([0-9]\+\.[0-9]\+\)-.*#\1 \2#p' \
              | sort -u)
            n=$(printf '%s\n' "$detected" | grep -c . || true)
            if [ "$n" -eq 0 ]; then
              echo "::error::产物里找不到 \`*_kernel-android<版本>-<内核>-<子版本>\` 形式的内核包，无法确定平台"
              exit 1
            fi
            if [ "$n" -gt 1 ]; then
              echo "::error::该 run 含多个平台，请手动指定 android_version 和 kernel_version。检测到："
              printf '%s\n' "$detected"
              exit 1
            fi
            if [ -z "$ANDROID" ]; then
              ANDROID=$(printf '%s\n' "$detected" | awk '{print $1}')
            fi
            if [ -z "$KERNEL" ]; then
              KERNEL=$(printf '%s\n' "$detected" | awk '{print $2}')
            fi
          fi

          # 本平台产物的 artifact 名前缀，例如 _kernel-android14-6.1-
          PREFIX="_kernel-${ANDROID}-${KERNEL}-"

          VARIANT="$IN_VARIANT"
          if [ -z "$VARIANT" ]; then
            VARIANT=$(printf '%s\n' "${dirs[@]}" \
              | sed -n "s#.*/\(.*\)${PREFIX}.*#\1#p" \
              | sort -u | head -1)
          fi
          if [ -z "$VARIANT" ]; then
            echo "::error::无法从产物名判断 KernelSU 变体，请手动指定 ksu_variant"
            exit 1
          fi

          echo "平台=$ANDROID  内核=$KERNEL  变体=$VARIANT"

          # 只发布指定的子版本号（如 162）；留空则全部发布
          SUB_LEVELS=$(printf '%s' "$IN_SUB_LEVELS" | tr ',' ' ' | tr -s ' ')
          if [ -n "$(printf '%s' "$SUB_LEVELS" | tr -d '[:space:]')" ]; then
            echo "限定子版本: $SUB_LEVELS"
          fi

          # ---- 3. 只挑本平台的内核产物，外加管理器和 SUSFS 模块 ----
          #      构建失败日志 / 补丁冲突文件留在 artifact 里，不进 Release
          rm -rf assets
          mkdir -p assets
          ASSETS_ABS="$(pwd)/assets"
          count=0
          kernel_count=0
          seen_subs=""
          for d in "${dirs[@]}"; do
            name="${d%/}"
            name="${name##*/}"

            case "$name" in
              *-Build-Logs|*-Rejects) continue ;;
            esac

            sub=""
            case "$name" in
              *"${PREFIX}"*)
                # artifact 名 PREFIX 之后紧跟子版本号，如 ..._kernel-android14-6.1-162-AnyKernel3
                rest="${name#*"${PREFIX}"}"
                sub="${rest%%-*}"
                if [ -n "$(printf '%s' "$SUB_LEVELS" | tr -d '[:space:]')" ]; then
                  case " ${SUB_LEVELS} " in
                    *" ${sub} "*) ;;
                    *) continue ;;
                  esac
                fi
                ;;
              *-Manager*|susfs-release-*) ;;
              *) continue ;;
            esac

            if [ -n "$sub" ]; then
              case " ${seen_subs} " in
                *" ${sub} "*) ;;
                *) seen_subs="${seen_subs} ${sub}" ;;
              esac
            fi

            if [ -n "$sub" ]; then
              # ---- 内核产物 ----
              zips=( "$d"*.zip )
              if [ "${#zips[@]}" -gt 0 ]; then
                # 「上传全部构建产物」模式：目录里已经是按版本命名的 zip / img，直接收
                for f in "$d"*; do
                  if [ -f "$f" ]; then
                    cp -f "$f" assets/
                    count=$((count + 1))
                    kernel_count=$((kernel_count + 1))
                  fi
                done
              else
                # 「仅上传 AnyKernel3」模式：artifact 存的是解开的目录
                # （anykernel.sh / Image / META-INF / tools）。拍平会互相覆盖同名文件
                # （每个版本都有 Image、banner），所以必须按版本重新打包成可刷入的 zip。
                out="${ANDROID}-${KERNEL}-${rest}.zip"
                ( cd "$d" && zip -q -r -6 "$ASSETS_ABS/$out" . )
                echo "打包: $out ($(du -h "$ASSETS_ABS/$out" | cut -f1))"
                count=$((count + 1))
                kernel_count=$((kernel_count + 1))
              fi
            else
              # ---- 管理器 APK / SUSFS 模块 / 其它附加产物：直接收 ----
              for f in "$d"*; do
                if [ -f "$f" ]; then
                  cp -f "$f" assets/
                  count=$((count + 1))
                fi
              done
            fi
          done

          # 没有内核产物时不要发一个只有管理器/模块的 Release
          if [ "$kernel_count" -eq 0 ]; then
            if [ -n "$(printf '%s' "$SUB_LEVELS" | tr -d '[:space:]')" ]; then
              echo "::error::该 run 里没有子版本 '$SUB_LEVELS' 的内核产物（本次构建可能失败，或版本号写错）"
              exit 1
            fi
            echo "::warning::该 run 里没有 $ANDROID/$KERNEL 的内核产物，跳过发布"
            count=0
          fi

          # ---- 4. 生成滚动 tag ----
          VARIANT_SLUG=$(printf '%s' "$VARIANT" \
            | LC_ALL=C tr -c 'A-Za-z0-9._-' '-' \
            | sed -e 's/-\{2,\}/-/g' -e 's/^-//' -e 's/-$//')

          # 明确限定单个子版本时，tag 带上具体版本号，如 A14-6.1.162-ReSukiSU
          SUBS_NORM=$(printf '%s' "$SUB_LEVELS" | tr -s ' ' | sed -e 's/^ //' -e 's/ $//')
          SUB_COUNT=$(printf '%s\n' "$SUBS_NORM" | tr ' ' '\n' | grep -c . || true)
          if [ -n "$SUBS_NORM" ] && [ "$SUB_COUNT" -eq 1 ]; then
            VERSION_STR="${KERNEL}.${SUBS_NORM}"
          else
            VERSION_STR="$KERNEL"
          fi
          TAG="A${ANDROID#android}-${VERSION_STR}-${VARIANT_SLUG}"

          {
            echo "tag=$TAG"
            echo "android=$ANDROID"
            echo "kernel=$KERNEL"
            echo "variant=$VARIANT"
            echo "subs=$SUBS_NORM"
            echo "asset_count=$count"
          } >> "$GITHUB_OUTPUT"

          echo "Release tag : $TAG"
          echo "待发布文件  : $count（内核包 $kernel_count 个）"
          if [ "$count" -gt 0 ]; then
            du -sh assets
            ls -1 assets
          fi

      # ==================== 创建 / 更新 Release ====================
      - name: 创建或更新 Release 并上传
        if: steps.collect.outputs.asset_count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ inputs.run_id }}
          TAG: ${{ steps.collect.outputs.tag }}
          ANDROID: ${{ steps.collect.outputs.android }}
          KERNEL: ${{ steps.collect.outputs.kernel }}
          VARIANT: ${{ steps.collect.outputs.variant }}
          SUBS: ${{ steps.collect.outputs.subs }}
          NOTES_HEADER: ${{ inputs.notes_header }}
        run: |
          set -euo pipefail

          # ---- 源 run 的元信息 ----
          info=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID")
          HEAD_SHA=$(printf '%s' "$info" | jq -r '.head_sha')
          CONCLUSION=$(printf '%s' "$info" | jq -r '.conclusion // "unknown"')
          BRANCH=$(printf '%s' "$info" | jq -r '.head_branch')
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}"
          BUILD_TIME=$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M (UTC+8)')
          FILE_COUNT=$(ls -1 assets | wc -l | tr -d ' ')
          TITLE="GKI ${ANDROID} / ${KERNEL} - ${VARIANT}"

          echo "标签: $TAG"
          echo "标题: $TITLE"

          # ---- 生成说明 ----
          {
            echo "## GKI 内核构建产物"
            echo
            echo "> 本 Release 由工作流自动发布，**滚动更新**：同一平台 + 同一 KernelSU 变体的文件会被最近一次构建覆盖。"
            echo "> Release Assets 不会过期（Actions artifact 只有 90 天保留期），因此下面的下载链接可以长期使用。"
            echo
            echo "| 项目 | 内容 |"
            echo "|:---|:---|"
            echo "| 平台 | \`${ANDROID}\` / ${KERNEL} |"
            echo "| KernelSU 变体 | ${VARIANT} |"
            if [ -n "$SUBS" ]; then
              echo "| 限定子版本 | \`${SUBS}\` |"
            fi
            echo "| 来源运行 | [#${RUN_ID}](${RUN_URL}) |"
            echo "| 构建结论 | \`${CONCLUSION}\` |"
            echo "| 分支 / 提交 | \`${BRANCH}\` @ \`${HEAD_SHA:0:7}\` |"
            echo "| 发布时间 | ${BUILD_TIME} |"
            echo
          } > body.md

          if [ -n "$(printf '%s' "$NOTES_HEADER" | tr -d '[:space:]')" ]; then
            printf '%s\n\n' "$NOTES_HEADER" >> body.md
          fi

          {
            echo "### 本次发布文件（${FILE_COUNT} 个）"
            echo
            echo "| 文件 | 大小 |"
            echo "|:---|:---|"
            for f in assets/*; do
              printf '| `%s` | %s |\n' "$(basename "$f")" "$(du -h "$f" | cut -f1)"
            done
            echo
            echo "---"
            echo
            echo "历史构建请到 [Actions 运行记录](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions) 里找对应 run 的 artifact（保留 90 天）。"
          } >> body.md

          # ---- 发布 ----
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "更新已有 Release: $TAG"
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" --notes-file body.md
          else
            echo "创建 Release: $TAG"
            # 不要传 --target 指向历史 commit：GitHub 会给 GITHUB_TOKEN 返回
            # 403 Resource not accessible by integration（在旧 commit 上建 tag 被拒）。
            # tag 交给默认分支 HEAD 即可，真实构建来源已写在说明的
            # 「来源运行 / 分支·提交」两行里。
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" --notes-file body.md
          fi

          echo "上传 ${FILE_COUNT} 个文件（同名覆盖）..."
          gh release upload "$TAG" assets/* --clobber --repo "$GITHUB_REPOSITORY"

          echo "✅ 发布完成: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG}"

      # ==================== 没有产物时给出提示 ====================
      - name: 无可发布产物
        if: steps.collect.outputs.asset_count == '0'
        run: |
          echo "::warning::该 run 中没有匹配「平台 + 变体」的产物（构建可能失败），已跳过发布"
